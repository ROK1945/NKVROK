<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-C4I 전술 워게임 & 글로벌 안보 시뮬레이터 (Ultimate Edition)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #05070a; color: #e2e8f0; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
        body { display: flex; flex-direction: row; }

        /* C4I 스타일 좌측 통제 패널 */
        #sidebar { width: 480px; min-width: 360px; background: rgba(11, 15, 25, 0.95); border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 15px; z-index: 1000; overflow-y: auto; backdrop-filter: blur(5px); }
        #map-wrapper { flex-grow: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; background: #000; }

        h1 { font-size: 16px; margin-bottom: 10px; color: #00d2d3; border-bottom: 2px solid #00d2d3; padding-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        
        .control-group { margin-bottom: 10px; background: #131a26; padding: 10px; border-radius: 4px; border: 1px solid #293445; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        label { display: block; font-size: 11px; margin-bottom: 4px; color: #94a3b8; font-weight: bold; letter-spacing: -0.5px; }
        select, input, button { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 3px; font-size: 11px; -webkit-appearance: none; outline: none; }
        select:focus, input:focus { border-color: #00d2d3; }
        
        .btn-action { background: #b91c1c; border: 1px solid #7f1d1d; font-weight: bold; cursor: pointer; margin-top: 4px; transition: all 0.2s; color: #fff; }
        .btn-action:hover { background: #dc2626; box-shadow: 0 0 8px rgba(220, 38, 38, 0.6); }
        
        .timeline-controls { display: flex; gap: 4px; margin-top: 5px; }
        .timeline-controls button { background: #0369a1; border-color: #075985; margin-top: 0; }
        #timeline-slider { width: 100%; margin-top: 5px; accent-color: #00d2d3; cursor: pointer; height: 4px; }

        #phase-box { background: #0f172a; border-left: 3px solid #00d2d3; padding: 8px; font-size: 11px; line-height: 1.4; margin-top: 5px; color: #cbd5e1; font-family: monospace; }
        
        /* 다중 레이어 토글 그리드 */
        .layer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
        .layer-btn { font-size: 10px; padding: 6px; text-align: left; padding-left: 8px; position: relative; border-left: 3px solid transparent; }
        .layer-btn.active { background: #1e293b; border-left-color: #00d2d3; color: #00d2d3; box-shadow: inset 20px 0 20px -20px rgba(0, 210, 211, 0.3); }

        #shelter-list-container { max-height: 100px; overflow-y: auto; margin-top: 4px; border: 1px solid #1e293b; background: #0b0f19; padding: 4px; font-family: monospace; }
        .shelter-item { padding: 5px; border-bottom: 1px solid #1e293b; font-size: 10px; cursor: pointer; color: #94a3b8; }
        .shelter-item:hover { background: #1e293b; color: #fff; }

        #status-msg { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); padding: 8px 12px; border-radius: 4px; font-size: 11px; border-left: 3px solid #00d2d3; z-index: 2000; color: #00d2d3; font-family: monospace; backdrop-filter: blur(4px); border: 1px solid #1e293b; }

        /* 군사 기호 및 효과 (APP-6D / MIL-STD-2525) */
        .mil-sym { display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff; border: 1.5px solid #000; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
        .sym-hostile { width: 20px; height: 20px; background: #ef4444; transform: rotate(45deg); }
        .sym-hostile span { transform: rotate(-45deg); }
        .sym-friendly { width: 24px; height: 16px; background: #3b82f6; }
        .sym-ally { width: 24px; height: 16px; background: #10b981; } /* 미군/유엔군 녹색 계열 */
        .sym-neutral { width: 20px; height: 20px; background: #f59e0b; border-radius: 50%; } /* 전략/비대칭/전자전 */

        .pulse-ring { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ef4444; animation: pulsate 2s infinite ease-out; position: absolute; left: -20px; top: -20px; }
        @keyframes pulsate { 0% { transform: scale(0.1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }

        #mobile-nav { display: none; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: calc(100% - 45px); display: flex; }
            #map-wrapper { width: 100%; height: calc(100% - 45px); display: none; }
            #mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; height: 45px; background: #0f172a; border-top: 1px solid #1e293b; z-index: 3000; }
            .nav-btn { flex: 1; border: none; background: transparent; color: #94a3b8; font-size: 12px; font-weight: bold; }
            .nav-btn.active { color: #00d2d3; border-top: 2px solid #00d2d3; background: #1e293b; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>[C4I] 합동 전술 워게임 플랫폼 (OPLAN 5015)</h1>
        
        <div class="control-group">
            <label>작전계획(OPLAN) 기반 전구(Theater) 시나리오</label>
            <select id="wargame-scenario">
                <option value="oplan5015" selected>[OPLAN 5015] 킬체인 선제타격 및 한미연합 북진통일 (D+100)</option>
                <option value="oplan5027">[OPLAN 5027] 전면 기습 방어 후 지연전 및 반격 (D+100)</option>
                <option value="hybrid">[Hybrid Warfare] 전자전(GPS/EMP)·특수전·사이버 복합전</option>
            </select>
            
            <div style="margin-top: 8px;">
                <label>전황 타임라인 (FLOT 변화) : <span id="day-label" style="color:#00d2d3;">D-Day</span></label>
                <input type="range" id="timeline-slider" min="0" max="100" value="0">
                <div class="timeline-controls">
                    <button class="btn-action" id="btn-play" style="background:#059669; border-color:#047857;">▶ 작전 전개</button>
                    <button class="btn-action" id="btn-pause" style="background:#d97706; border-color:#b45309;">❚❚ 정지</button>
                    <button class="btn-action" id="btn-undo" style="background:#475569; border-color:#334155;">초기화</button>
                </div>
            </div>
            <div id="phase-box">System Ready. 대기 상태.</div>
        </div>

        <div class="control-group">
            <label>전장 정보 레이어 통제 (COP Layers)</label>
            <div class="layer-grid">
                <button class="layer-btn active" id="layer-ground" style="border-color:#3b82f6;">지상전력 (전선/기갑/보병)</button>
                <button class="layer-btn active" id="layer-strategic" style="border-color:#ef4444;">전략/비대칭 (핵/SLBM/미사일)</button>
                <button class="layer-btn active" id="layer-ew" style="border-color:#f59e0b;">전자전/방공 (GPS교란/KAMD)</button>
                <button class="layer-btn active" id="layer-loc" style="border-color:#10b981;">보급/인프라 (LOC/대피소)</button>
            </div>
        </div>

        <div class="control-group">
            <label>지도 시현 모드</label>
            <select id="map-mode">
                <option value="dark" selected>지휘통제소(C4I) 다크맵</option>
                <option value="satellite">위성 정찰 타일 (V-World)</option>
                <option value="standard">일반 지형/도로 타일</option>
            </select>
        </div>

        <div class="control-group">
            <label>전국 공간 데이터 및 피난 시설 검색</label>
            <div style="display: flex; gap: 4px;">
                <input type="text" id="search-input" placeholder="좌표, 지명, 대피소명">
                <button class="btn-action" id="btn-global-search" style="width:60px; margin-top:0;">검색</button>
            </div>
        </div>

        <div id="shelter-list-container">
            <div style="text-align: center; color: #475569; padding: 10px;">DB 초기화 중...</div>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="map"></div>
        <div id="status-msg">C4I System Initialized.</div>
    </div>

    <div id="mobile-nav">
        <button class="nav-btn active" id="tab-sidebar" onclick="switchMobileTab('sidebar')">통제반</button>
        <button class="nav-btn" id="tab-map" onclick="switchMobileTab('map')">상황도</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        const VWORLD_API = "AB8056F3-8810-4503-9544-FA9F94BB07C1";
        let map;
        let shelterDataList = [];
        let clusterGroup;
        
        // C4I Layers
        let layers = {
            ground: L.layerGroup(),
            strategic: L.layerGroup(),
            ew: L.layerGroup(),
            loc: L.layerGroup(),
            flot: L.layerGroup() // 전단선(Forward Line of Own Troops)
        };
        let tileLayers = {};
        let playInterval = null;

        const C4I_DATA = {
            ground: [
                { type: 'friendly', name: '지상작전사령부', lat: 37.23, lng: 127.11 },
                { type: 'friendly', name: '제1군단', lat: 37.78, lng: 126.88 },
                { type: 'friendly', name: '제2군단', lat: 37.88, lng: 127.73 },
                { type: 'ally', name: '한미연합군사령부 / 캠프 험프리스', lat: 36.96, lng: 127.03 },
                { type: 'hostile', name: '제1군단 전선사령부', lat: 38.50, lng: 126.50 },
                { type: 'hostile', name: '제2군단 전선사령부', lat: 38.30, lng: 127.40 },
                { type: 'hostile', name: '제820전차군단', lat: 38.60, lng: 126.10 }
            ],
            strategic: [
                { name: '영변 핵시설', lat: 39.80, lng: 125.75, desc: '핵물질 생산 고위험 표적 (Kill Chain 타격 우선순위)' },
                { name: '풍계리 핵실험장', lat: 41.28, lng: 129.08, desc: '지하 핵실험 시설' },
                { name: '신포항 (SLBM 기지)', lat: 40.01, lng: 128.16, desc: '잠수함 발사 탄도미사일(SLBM) 기지' },
                { name: '평양 순안 비행장', lat: 39.20, lng: 125.67, desc: '화성-17형 ICBM 발사 원점' }
            ],
            ew: [
                { name: '해주 GPS 교란 발신지', lat: 38.03, lng: 125.71, radius: 80000, color: '#f59e0b' },
                { name: '개성 통신 교란 구역', lat: 37.97, lng: 126.55, radius: 40000, color: '#f59e0b' },
                { name: '오산 KAMD (THAAD/PAC-3) 방공망', lat: 37.09, lng: 127.03, radius: 50000, color: '#3b82f6' },
                { name: '성주 THAAD 포대 반경', lat: 36.05, lng: 128.22, radius: 200000, color: '#3b82f6' }
            ],
            loc: [
                { name: '경부 축선 (MSR)', path: [[37.56,126.97],[36.35,127.38],[35.10,129.04]], color: '#eab308' },
                { name: '서해안 축선 (ASR)', path: [[37.45,126.65],[36.78,126.65],[34.81,126.39]], color: '#eab308' },
                { name: '전방 제1번 전술도로 (파주-개성)', path: [[37.75,126.78],[37.95,126.55]], color: '#ef4444' } // 초크포인트
            ]
        };

        const createIcon = (type, txt) => L.divIcon({
            className: '',
            html: `<div class="mil-sym sym-${type}"><span>${txt}</span></div>`,
            iconSize: [24,24], iconAnchor: [12,12]
        });
        
        const createTargetIcon = () => L.divIcon({
            className: '',
            html: `<div class="mil-sym sym-neutral">☢</div><div class="pulse-ring"></div>`,
            iconSize: [20,20], iconAnchor: [10,10]
        });

        function switchMobileTab(t) {
            document.getElementById('sidebar').style.display = t==='sidebar'?'flex':'none';
            document.getElementById('map-wrapper').style.display = t==='map'?'block':'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            if(t==='map') setTimeout(()=>map.invalidateSize(), 100);
        }

        function initMap() {
            map = L.map('map', { maxZoom: 18, minZoom: 5, zoomControl: false }).setView([38.0, 127.0], 7);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            tileLayers.dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');
            tileLayers.satellite = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API}/Satellite/{z}/{y}/{x}.jpeg`);
            tileLayers.standard = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API}/Base/{z}/{y}/{x}.png`);
            tileLayers.dark.addTo(map);

            clusterGroup = L.markerClusterGroup({ chunkedLoading: true, disableClusteringAtZoom: 13, maxClusterRadius: 50 });
            
            Object.values(layers).forEach(layer => map.addLayer(layer));
            map.addLayer(clusterGroup);

            renderStaticLayers();
            updateTimeline(0);

            document.getElementById('timeline-slider').addEventListener('input', (e) => updateTimeline(parseInt(e.target.value)));
            document.getElementById('map-mode').addEventListener('change', (e) => {
                Object.values(tileLayers).forEach(l => map.removeLayer(l));
                tileLayers[e.target.value].addTo(map);
            });
            
            document.querySelectorAll('.layer-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.id.replace('layer-', '');
                    e.target.classList.toggle('active');
                    if (e.target.classList.contains('active')) map.addLayer(layers[id] || clusterGroup);
                    else map.removeLayer(layers[id] || clusterGroup);
                });
            });
        }

        function renderStaticLayers() {
            // 지상전력
            C4I_DATA.ground.forEach(u => L.marker([u.lat, u.lng], {icon: createIcon(u.type, u.type==='ally'?'US':(u.type==='hostile'?'적':'아'))}).bindPopup(u.name).addTo(layers.ground));
            
            // 전략자산 (핵/미사일)
            C4I_DATA.strategic.forEach(s => L.marker([s.lat, s.lng], {icon: createTargetIcon()}).bindPopup(`<b>[전략표적] ${s.name}</b><br>${s.desc}`).addTo(layers.strategic));
            
            // 전자전/방공 (EW / KAMD)
            C4I_DATA.ew.forEach(e => {
                L.circle([e.lat, e.lng], { radius: e.radius, color: e.color, fillOpacity: 0.1, weight: 1, dashArray: '4,4' }).bindPopup(`<b>[EW/방공망]</b> ${e.name}`).addTo(layers.ew);
            });

            // 보급로 (LOC)
            C4I_DATA.loc.forEach(l => L.polyline(l.path, { color: l.color, weight: 3, opacity: 0.7 }).bindPopup(l.name).addTo(layers.loc));
        }

        // FLOT (전단선) 및 시나리오 렌더링 알고리즘
        function updateTimeline(day) {
            document.getElementById('day-label').textContent = day === 0 ? 'D-Day' : `D+${day}`;
            layers.flot.clearLayers();
            
            const sce = document.getElementById('wargame-scenario').value;
            let msg = '';
            
            // FEBA Alpha (기준선)
            const pts = [[37.75, 126.50], [37.85, 127.00], [38.10, 127.50], [38.30, 128.40]];
            
            if (day === 0) {
                L.polyline(pts, {color: '#94a3b8', weight: 4, dashArray: '5,5'}).bindPopup('MDL / FEBA').addTo(layers.flot);
                msg = "[D-Day] 평시 경계태세 및 징후 감시 중.";
            } else {
                let shiftedPts = [];
                if (sce === 'oplan5015') {
                    // 킬체인 선제타격 후 빠른 북진 (다항식 알고리즘: D+10까지 정체, 이후 급격히 북진)
                    let shift = day < 10 ? (day * 0.01) : (day * 0.05);
                    shiftedPts = pts.map(p => [p[0] + shift, p[1]]);
                    
                    if(day === 1) msg = "Kill Chain 가동. 전략 표적 선제 정밀타격 개시.";
                    else if(day < 30) msg = "공중우세 확보 및 기동군단 북진 개시.";
                    else msg = `KMPR 대량응징보복 연계, 평양선(위도 ${shiftedPts[0][0].toFixed(1)}) 이북 돌파.`;
                    
                    L.polygon([[33,124],[33,132], [shiftedPts[3][0],132], [shiftedPts[0][0],124]], {color:'#3b82f6', fillOpacity: 0.2, weight:1}).addTo(layers.flot);
                    L.polyline(shiftedPts, {color: '#3b82f6', weight: 5}).bindPopup('연합군 진격선 (FLOT)').addTo(layers.flot);
                } 
                else if (sce === 'oplan5027') {
                    // 기습 방어 후 지연전 (D+15까지 남하, 이후 증원군과 북진)
                    let shift = day < 15 ? -(day * 0.04) : -0.6 + ((day - 15) * 0.05);
                    shiftedPts = pts.map(p => [p[0] + shift, p[1]]);
                    
                    if(day < 15) msg = "적 전면 기습. 한강 이북 지연전(Delaying Action) 수행 중.";
                    else if(day < 40) msg = "FDO(신속억제방안) 및 미 증원전력(TPFDD) 전개. 반격 개시.";
                    else msg = "주도권 확보 및 북진 단계 전환.";

                    L.polyline(shiftedPts, {color: day<15 ? '#ef4444' : '#3b82f6', weight: 5}).addTo(layers.flot);
                }
                else {
                    // 하이브리드전 (전선 고착, 내부 교란 집중)
                    shiftedPts = pts;
                    L.polyline(shiftedPts, {color: '#f59e0b', weight: 4, dashArray: '10,10'}).addTo(layers.flot);
                    msg = "GPS/EMP 교란 및 후방 침투 지속. 전단선 고착화.";
                }
            }
            document.getElementById('phase-box').innerHTML = msg;
        }

        // 제어 버튼
        document.getElementById('btn-play').addEventListener('click', () => {
            if(playInterval) clearInterval(playInterval);
            playInterval = setInterval(() => {
                let sl = document.getElementById('timeline-slider');
                if(sl.value >= 100) { clearInterval(playInterval); return; }
                sl.value = parseInt(sl.value) + 1;
                updateTimeline(parseInt(sl.value));
            }, 100);
        });
        document.getElementById('btn-pause').addEventListener('click', () => clearInterval(playInterval));
        document.getElementById('btn-undo').addEventListener('click', () => {
            clearInterval(playInterval); document.getElementById('timeline-slider').value = 0; updateTimeline(0);
        });

        // 지오코딩 및 대피소 검색
        document.getElementById('btn-global-search').addEventListener('click', async () => {
            const kw = document.getElementById('search-input').value.trim();
            if(!kw) return;
            document.getElementById('status-msg').textContent = `Targeting: ${kw}...`;
            
            // 1차: 대피소 로컬 DB 검색
            const matched = shelterDataList.filter(s => (s.name && s.name.includes(kw)) || (s.addr && s.addr.includes(kw)));
            if (matched.length > 0) {
                renderShelterList(matched);
                map.fitBounds(L.latLngBounds(matched.map(s => [s.lat, s.lng])), { maxZoom: 14 });
                document.getElementById('status-msg').textContent = `Local DB: ${matched.length} points found.`;
                return;
            }
            
            // 2차: 글로벌 좌표 검색 (OSM)
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(kw)}`);
                const data = await res.json();
                if(data.length > 0) {
                    map.flyTo([data[0].lat, data[0].lon], 13);
                    document.getElementById('status-msg').textContent = `OSINT: ${data[0].display_name}`;
                } else document.getElementById('status-msg').textContent = `Target Not Found.`;
            } catch(e) { document.getElementById('status-msg').textContent = `Network Error.`; }
        });

        // CSV 로더 (방어적 파싱)
        async function loadShelterCSV() {
            const files = ['Shelter.csv', 'shelter.csv', '민방위대피시설 (2).csv'];
            for(let f of files) {
                try {
                    const res = await fetch(f);
                    if(res.ok) {
                        const buf = await res.arrayBuffer();
                        let txt = new TextDecoder('utf-8').decode(buf);
                        if(txt.includes('')) txt = new TextDecoder('euc-kr').decode(buf);
                        
                        txt.split(/\r\n|\n/).forEach(line => {
                            if(!line) return;
                            let inQ = false, curr = '', r = [];
                            for(let c of line) {
                                if(c==='"') inQ = !inQ;
                                else if(c===',' && !inQ) { r.push(curr.trim()); curr=''; }
                                else curr += c;
                            }
                            r.push(curr.trim());
                            
                            if(r.length >= 7) {
                                let lat = parseFloat(r[16]), lng = parseFloat(r[17]);
                                if(isNaN(lat)||isNaN(lng)) {
                                    for(let v of r) {
                                        let num = parseFloat(v);
                                        if(!isNaN(num)) {
                                            if(num>=33 && num<=39) lat = num;
                                            if(num>=124 && num<=132) lng = num;
                                        }
                                    }
                                }
                                if(!isNaN(lat) && !isNaN(lng)) {
                                    shelterDataList.push({name: r[5]?.replace(/["']/g,"")||"대피소", addr: r[3]?.replace(/["']/g,""), type: r[6]?.replace(/["']/g,""), lat, lng});
                                }
                            }
                        });
                        
                        document.getElementById('status-msg').textContent = `Shelter DB Loaded (${shelterDataList.length})`;
                        const mks = shelterDataList.map(s => L.marker([s.lat, s.lng]).bindPopup(`<b>${s.name}</b><br>${s.type}`));
                        clusterGroup.addLayers(mks);
                        renderShelterList(shelterDataList);
                        break;
                    }
                } catch(e) {}
            }
        }

        function renderShelterList(arr) {
            const c = document.getElementById('shelter-list-container');
            c.innerHTML = '';
            arr.slice(0, 100).forEach(s => {
                const div = document.createElement('div');
                div.className = 'shelter-item';
                div.innerHTML = `${s.name} <br> <span style="font-size:8px;">${s.addr}</span>`;
                div.onclick = () => map.flyTo([s.lat, s.lng], 16);
                c.appendChild(div);
            });
        }

        window.onload = () => { initMap(); loadShelterCSV(); };
    </script>
</body>
</html>
