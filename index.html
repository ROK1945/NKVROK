<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>국가 비상대비 종합 시뮬레이터</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        
        header { position: absolute; top: 0; left: 0; right: 0; height: 44px; background: #1e293b; padding: 0 12px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; z-index: 1001; }
        header h1 { font-size: 0.85rem; font-weight: 700; color: #ef4444; }
        
        /* 지도 레이아웃 */
        #map { position: absolute; top: 44px; bottom: 120px; left: 0; right: 0; background: #020617; z-index: 1; }
        
        /* 좌측 무기 및 진입로 선택 패널 */
        #control-panel { position: absolute; top: 52px; left: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 10px; border-radius: 8px; width: 210px; font-size: 0.72rem; }
        #control-panel label { display: block; color: #94a3b8; margin-top: 6px; margin-bottom: 2px; font-weight: 600; }
        #control-panel select, #control-panel button { width: 100%; padding: 5px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 4px; font-size: 0.72rem; }
        #control-panel button { margin-top: 8px; background: #2563eb; font-weight: bold; cursor: pointer; border: none; }

        /* 우측 실시간 분석 HUD */
        #hud { position: absolute; top: 52px; right: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 10px; border-radius: 8px; width: 210px; font-size: 0.72rem; pointer-events: none; }
        #hud h2 { font-size: 0.78rem; color: #38bdf8; margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 3px; display: flex; justify-content: space-between; }
        .hud-item { margin-bottom: 4px; display: flex; justify-content: space-between; }
        .hud-label { color: #94a3b8; }
        .hud-value { font-weight: 600; color: #f1f5f9; text-align: right; }
        
        /* 하단 생존 수칙 레이어 */
        #guide-panel { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: #1e293b; border-top: 2px solid #ef4444; padding: 8px 12px; overflow-y: auto; z-index: 1001; font-size: 0.72rem; }
        #guide-panel h3 { color: #f59e0b; font-size: 0.78rem; margin-bottom: 3px; }
        .guide-step { margin-bottom: 2px; color: #cbd5e1; line-height: 1.25; }
        .highlight { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

        <option value="nuke_tactical">전술핵 / 전술유도무기 (KN-23)</option>
    </select>
