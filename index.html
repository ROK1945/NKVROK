<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 민방위 및 비상 대피 시뮬레이터 (NKVKOK)</title>
    
    <!-- Leaflet CSS (지도 라이브러리) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* 기본 레이아웃 및 비율 조정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 좌측 컨트롤 및 정보 패널 */
        #sidebar { width: 380px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; z-index: 1000; }
        h1 { font-size: 18px; margin-bottom: 15px; color: #ff5252; border-bottom: 2px solid #ff5252; padding-bottom: 8px; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #aaa; }
        select, input, button { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
        button { background: #d32f2f; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #f44336; }

        /* 대피소 검색 및 리스트 영역 */
        #shelter-list-container { flex-grow: 1; overflow-y: auto; margin-top: 10px; border: 1px solid #333; background: #181818; border-radius: 4px; padding: 10px; }
        .shelter-item { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 12px; cursor: pointer; }
        .shelter-item:hover { background: #2c2c2c; }
        .shelter-name { font-weight: bold; color: #ff8a80; }
        .shelter-addr { color: #888; font-size: 11px; }

        /* 우측 지도 영역 (비율 100% 채우기) */
        #map { flex-grow: 1; height: 100%; }
        
        /* 로딩 오버레이 스타일 */
        #loading { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; font-size: 12px; z-index: 2000; color: #ffeb3b; display: none; }
    </style>
</head>
<body>

    <!-- 좌측 컨트롤 패널 -->
    <div id="sidebar">
        <h1>🛡️ 대한민국 비상대피 시뮬레이터</h1>
        
        <div class="control-group">
            <label for="threat-level">위협 단계 설정</label>
            <select id="threat-level">
                <option value="4">DEFCON 4 (평시 경계)</option>
                <option value="3">DEFCON 3 (국지전 징후)</option>
                <option value="2">DEFCON 2 (전면전 임박)</option>
                <option value="1" selected>DEFCON 1 (전시 상황)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="search-shelter">대피소 검색</label>
            <input type="text" id="search-shelter" placeholder="지역 또는 시설명 입력 (예: 서울, 성균관대)">
        </div>

        <label>근린 대피소 목록 (<span id="shelter-count">0</span>개)</label>
        <div id="shelter-list-container">
            <div style="text-align: center; color: #666; padding: 20px;">Shelter.csv 데이터를 불러오는 중...</div>
        </div>
    </div>

    <!-- 우측 지도 영역 -->
    <div id="map"></div>
    <div id="loading">데이터 로딩 중...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 전역 변수 설정
        let map;
        let shelterDataList = [];
        let markerLayer = L.layerGroup(); // 마커 관리 레이어

        // 1. 지도 초기화 (서울 중심 기준)
        function initMap() {
            map = L.map('map').setView([37.5665, 126.9780], 12);

            // 다크 모드 타일 레이어 적용 (시뮬레이터 분위기 연출)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            markerLayer.addTo(map);
        }

        // 2. Shelter.csv 비동기 로드
        async function loadShelterCSV() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'block';

            try {
                const response = await fetch('Shelter.csv');
                if (!response.ok) throw new Error(`HTTP 에러 발생: ${response.status}`);
                
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Shelter.csv 파일 로드 실패:", error);
                document.getElementById('shelter-list-container').innerHTML = 
                    `<div style="color: #ff5252; padding: 10px; text-align: center;">대피소 파일을 불러오지 못했습니다.<br>파일명(Shelter.csv)과 경로를 확인해주세요.</div>`;
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // 3. CSV 데이터 파싱 함수
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            shelterDataList = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const columns = line.split(',');

                if (columns.length >= 7) {
                    const address = columns[0].trim();     // 소재지전체주소
                    const roadAddress = columns[1].trim(); // 도로명전체주소
                    const facilityName = columns[2].trim();// 시설명
                    const facilityType = columns[3].trim();// 시설구분
                    const locationDesc = columns[4].trim();// 시설위치
                    const lat = parseFloat(columns[5]);    // 위도
                    const lng = parseFloat(columns[6]);    // 경도

                    if (!isNaN(lat) && !isNaN(lng)) {
                        shelterDataList.push({
                            address,
                            roadAddress,
                            facilityName,
                            facilityType,
                            locationDesc,
                            lat,
                            lng
                        });
                    }
                }
            }

            console.log(`총 ${shelterDataList.length}개의 대피소 파싱 완료.`);
            renderShelterList(shelterDataList);
            renderMarkers(shelterDataList);
        }

        // 4. 지도에 마커 표시
        function renderMarkers(shelters) {
            markerLayer.clearLayers(); // 기존 마커 초기화

            shelters.forEach(shelter => {
                const marker = L.marker([shelter.lat, shelter.lng]);
                marker.bindPopup(`
                    <div style="color: #333; font-family: sans-serif;">
                        <b>🛡️ ${shelter.facilityName}</b><br>
                        <hr style="margin: 4px 0;">
                        <b>주소:</b> ${shelter.roadAddress || shelter.address}<br>
                        <b>유형:</b> ${shelter.facilityType} (${shelter.locationDesc})
                    </div>
                `);
                markerLayer.addLayer(marker);
            });
        }

        // 5. 좌측 패널에 대피소 리스트 렌더링
        function renderShelterList(shelters) {
            const container = document.getElementById('shelter-list-container');
            document.getElementById('shelter-count').textContent = shelters.length;
            
            container.innerHTML = '';

            if (shelters.length === 0) {
                container.innerHTML = `<div style="padding: 10px; text-align: center; color: #888;">검색된 대피소가 없습니다.</div>`;
                return;
            }

            // 렌더링 성능을 위해 상위 100개만 먼저 표시 (전체 렌더링 시 렉 방지)
            const displayList = shelters.slice(0, 100);

            displayList.forEach(shelter => {
                const item = document.createElement('div');
                item.className = 'shelter-item';
                item.innerHTML = `
                    <div class="shelter-name">${shelter.facilityName}</div>
                    <div class="shelter-addr">${shelter.roadAddress || shelter.address}</div>
                `;
                
                // 리스트 클릭 시 해당 위치로 지도 이동 및 팝업 오픈
                item.addEventListener('click', () => {
                    map.setView([shelter.lat, shelter.lng], 16);
                });

                container.appendChild(item);
            });
        }

        // 6. 검색 기능 구현
        document.getElementById('search-shelter').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = shelterDataList.filter(s => 
                s.facilityName.toLowerCase().includes(keyword) || 
                s.address.toLowerCase().includes(keyword) || 
                s.roadAddress.toLowerCase().includes(keyword)
            );
            renderShelterList(filtered);
            renderMarkers(filtered);
        });

        // 페이지 로드 시 초기화 실행
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadShelterCSV();
        });
    </script>
</body>
</html>
