<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>대한민국 전술 워게임 & 전국 대피 시뮬레이터 (NKVKOK)</title>
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: #0b0f19; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', '맑은 고딕', sans-serif; }
        
        body { display: flex; flex-direction: row; }

        /* PC 기본 레이아웃 */
        #sidebar { width: 400px; min-width: 320px; background: #131824; border-right: 1px solid #2a3447; display: flex; flex-direction: column; padding: 15px; z-index: 1000; overflow-y: auto; }
        #map-wrapper { flex-grow: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; }

        h1 { font-size: 16px; margin-bottom: 10px; color: #ff4757; border-bottom: 2px solid #ff4757; padding-bottom: 5px; }
        
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; margin-bottom: 3px; color: #8ab4f8; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; background: #1a2333; border: 1px solid #324158; color: #fff; border-radius: 6px; font-size: 13px; -webkit-appearance: none; }
        button { background: #c62828; border: none; font-weight: bold; cursor: pointer; margin-top: 4px; }
        button:active { opacity: 0.8; }
        
        #btn-undo { background: #37474f; border: 1px solid #546e7a; margin-bottom: 6px; }
        #btn-global-search { background: #1976d2; }

        #phase-box { background: #1b263b; border-left: 3px solid #ff4757; padding: 8px; font-size: 11px; line-height: 1.4; margin-top: 4px; border-radius: 0 4px 4px 0; color: #cfd8dc; }
        
        #shelter-list-container { max-height: 150px; overflow-y: auto; margin-top: 4px; border: 1px solid #2a3447; background: #0f141f; border-radius: 4px; padding: 4px; -webkit-overflow-scrolling: touch; }
        .shelter-item { padding: 8px; border-bottom: 1px solid #1e293b; font-size: 11px; cursor: pointer; }
        .shelter-name { font-weight: bold; color: #ff8a80; font-size: 12px; margin-bottom: 2px; }
        .shelter-addr { color: #9ca3af; font-size: 10px; }

        #status-msg { position: absolute; top: 10px; right: 10px; left: 10px; background: rgba(15, 23, 42, 0.92); padding: 8px 12px; border-radius: 6px; font-size: 11px; border-left: 4px solid #00ffcc; z-index: 2000; color: #00ffcc; font-weight: bold; pointer-events: none; text-overflow: ellipsis; overflow: hidden; whitespace: nowrap; }

        /* 모바일 탭 전환용 바텀 토글 버튼 (기본 숨김) */
        #mobile-nav { display: none; }

        /* MIL-STD 피아 식별 전술 아이콘 */
        .mil-icon-hostile { width: 18px; height: 18px; background: #ff4757; transform: rotate(45deg); border: 2px solid #000; box-shadow: 0 0 6px #ff4757; display: flex; align-items: center; justify-content: center; }
        .mil-icon-friendly { width: 22px; height: 16px; background: #2e86de; border: 2px solid #000; box-shadow: 0 0 6px #2e86de; display: flex; align-items: center; justify-content: center; }
        .icon-label { font-size: 9px; color: #fff; font-weight: bold; transform: rotate(-45deg); }
        .friendly-label { font-size: 9px; color: #fff; font-weight: bold; }

        /* 📱 스마트폰/모바일 디바이스 반응형 CSS (@media) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: calc(100% - 50px); display: flex; }
            #map-wrapper { width: 100%; height: calc(100% - 50px); display: none; }

            /* 모바일 하단 탭 메뉴 바 */
            #mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; height: 50px; background: #1a2333; border-top: 1px solid #2a3447; z-index: 3000; }
            .nav-btn { flex: 1; border: none; background: transparent; color: #8ab4f8; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0; border-radius: 0; }
            .nav-btn.active { background: #25344d; color: #00ffcc; border-top: 2px solid #00ffcc; }
            
            #status-msg { top: 10px; left: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <!-- 좌측 전술 통제 패널 -->
    <div id="sidebar">
        <h1>🎖️ 전술 워게임 & 대피 시뮬레이터</h1>
        
        <button id="btn-undo">🔄 전술 그래픽 및 시뮬레이션 초기화</button>

        <div class="control-group">
            <label for="threat-level">DEFCON 페이즈 및 시나리오</label>
            <select id="threat-level">
                <option value="4">DEFCON 4 (평시 경계 태세)</option>
                <option value="3">DEFCON 3 (국지 도발 / 포병 전진)</option>
                <option value="2">DEFCON 2 (전면전 임박 / 기갑 집결)</option>
                <option value="1" selected>DEFCON 1 (전시 상황 / 전면 남침)</option>
            </select>
            <div id="phase-box">시나리오 로딩 중...</div>
        </div>

        <div class="control-group">
            <label for="weapon-type">북한 위협 무기 체계 & 공격 축선</label>
            <select id="weapon-type">
                <option value="artillery" selected>[화력전] 장사정포/방사포 포격</option>
                <option value="armor">[기동전] 제1·2기갑군단 남침 돌파</option>
                <option value="nuke">[비대칭] KN-23/전술핵 공중폭발 (150kt)</option>
                <option value="emp">[전자전] 고고도 EMP 전자기파 타격</option>
            </select>
            <button id="btn-strike">🎯 워게임 시뮬레이션 지도 전개</button>
        </div>

        <div class="control-group">
            <label for="map-mode">전술 지도 모드</label>
            <select id="map-mode">
                <option value="satellite" selected>브이월드 위성 항공 샷</option>
                <option value="standard">브이월드 일반 도로명 지도</option>
                <option value="dark">다크 야간 전술 맵</option>
            </select>
        </div>

        <div class="control-group">
            <label>통합 주소 / 대피소 검색</label>
            <input type="text" id="search-input" placeholder="주소, 도시, 지명 또는 대피소명">
            <button id="btn-global-search">🔍 지도 지명/주소 위치 검색 및 이동</button>
        </div>

        <label>근린 대피소 목록 (<span id="shelter-count">0</span>개) - 클릭 시 즉시 이동</label>
        <div id="shelter-list-container">
            <div style="text-align: center; color: #666; padding: 15px;">전국 데이터 로딩 중...</div>
        </div>
    </div>

    <!-- 우측 지도 영역 -->
    <div id="map-wrapper">
        <div id="map"></div>
        <div id="status-msg">시스템 초기화 중...</div>
    </div>

    <!-- 모바일 하단 탭 전환 메뉴 -->
    <div id="mobile-nav">
        <button class="nav-btn active" id="tab-sidebar" onclick="switchMobileTab('sidebar')">⚙️ 제어 패널</button>
        <button class="nav-btn" id="tab-map" onclick="switchMobileTab('map')">🗺️ 전술 지도 보기</button>
    </div>

    <!-- Leaflet & MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        const VWORLD_API_KEY = "AB8056F3-8810-4503-9544-FA9F94BB07C1";
        let map;
        let shelterDataList = [];
        let markerClusterGroup;
        let tacticalLayer = L.layerGroup();
        let tileLayers = {};

        const phaseScenarios = {
            '4': "<b>[DEFCON 4] 평시 경계:</b> 북한군 4개 전선군단 대치. 국군 지작사 통상 경계태세 유지.",
            '3': "<b>[DEFCON 3] 국지전 징후:</b> 전방 장사정포 갱도 개방 포착. 아군 준비태세 발령.",
            '2': "<b>[DEFCON 2] 전면전 임박:</b> 북한군 기갑군단 집결. 국군 주저항선(FEBA Alpha) 전개.",
            '1': "<b>[DEFCON 1] 전면 남침:</b> 북한군 포격 및 전차 남하. 민간인 남방 한계선 이남 대피."
        };

        const createMilIcon = (type, title) => L.divIcon({
            className: 'mil-icon-wrapper',
            html: type === 'hostile' 
                ? `<div class="mil-icon-hostile" title="${title}"><span class="icon-label">적</span></div>`
                : `<div class="mil-icon-friendly" title="${title}"><span class="friendly-label">아</span></div>`,
            iconSize: [22, 22], iconAnchor: [11, 11]
        });

        // 모바일 탭 전환 함수
        function switchMobileTab(target) {
            const sidebar = document.getElementById('sidebar');
            const mapWrapper = document.getElementById('map-wrapper');
            const tabSidebar = document.getElementById('tab-sidebar');
            const tabMap = document.getElementById('tab-map');

            if (target === 'sidebar') {
                sidebar.style.display = 'flex';
                mapWrapper.style.display = 'none';
                tabSidebar.classList.add('active');
                tabMap.classList.remove('active');
            } else {
                sidebar.style.display = 'none';
                mapWrapper.style.display = 'block';
                tabSidebar.classList.remove('active');
                tabMap.classList.add('active');
                
                // 지도가 렌더링 영역 크기를 재계산하도록 강제 호출
                setTimeout(() => {
                    if (map) map.invalidateSize();
                }, 100);
            }
        }

        function initMap() {
            map = L.map('map', { maxZoom: 19, minZoom: 5, tap: true }).setView([36.5, 127.8], 7);

            tileLayers.satellite = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/Satellite/{z}/{y}/{x}.jpeg`, {
                maxZoom: 19, errorTileUrl: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
            });

            tileLayers.standard = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/Base/{z}/{y}/{x}.png`, {
                maxZoom: 19, errorTileUrl: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
            });

            tileLayers.dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });

            tileLayers.satellite.addTo(map);

            // 모바일 메모리 부하 방지를 위한 마커 클러스터 설정
            markerClusterGroup = L.markerClusterGroup({
                chunkedLoading: true,
                chunkInterval: 100,
                maxClusterRadius: 60,
                disableClusteringAtZoom: 14
            });

            map.addLayer(markerClusterGroup);
            tacticalLayer.addTo(map);

            updatePhaseBox();
            
            map.on('click', (e) => {
                runWargameSimulation(document.getElementById('weapon-type').value, e.latlng.lat, e.latlng.lng);
            });
        }

        document.getElementById('btn-undo').addEventListener('click', () => {
            tacticalLayer.clearLayers();
            document.getElementById('status-msg').textContent = "🔄 시뮬레이션 초기화됨";
        });

        document.getElementById('threat-level').addEventListener('change', updatePhaseBox);
        function updatePhaseBox() {
            document.getElementById('phase-box').innerHTML = phaseScenarios[document.getElementById('threat-level').value];
        }

        document.getElementById('map-mode').addEventListener('change', (e) => {
            Object.values(tileLayers).forEach(layer => map.removeLayer(layer));
            if (tileLayers[e.target.value]) tileLayers[e.target.value].addTo(map);
        });

        document.getElementById('btn-strike').addEventListener('click', () => {
            const center = map.getCenter();
            runWargameSimulation(document.getElementById('weapon-type').value, center.lat, center.lng);
            // 모바일에서 실행 시 자동으로 지도 탭으로 전환
            if (window.innerWidth <= 768) {
                switchMobileTab('map');
            }
        });

        document.getElementById('btn-global-search').addEventListener('click', async () => {
            const keyword = document.getElementById('search-input').value.trim();
            if(!keyword) return;

            document.getElementById('status-msg').textContent = `🔍 [${keyword}] 검색 중...`;
            
            const matchedShelters = shelterDataList.filter(s => 
                (s.facilityName && s.facilityName.includes(keyword)) || 
                (s.address && s.address.includes(keyword)) || 
                (s.roadAddress && s.roadAddress.includes(keyword))
            );

            if (matchedShelters.length > 0) {
                renderShelterList(matchedShelters);
                renderMapMarkers(matchedShelters);
                
                const bounds = L.latLngBounds(matchedShelters.map(s => [s.lat, s.lng]));
                map.fitBounds(bounds, { maxZoom: 14, padding: [20, 20] });
                document.getElementById('status-msg').textContent = `📍 [${keyword}] 대피소 ${matchedShelters.length}개 발견`;
                if (window.innerWidth <= 768) switchMobileTab('map');
                return;
            }

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}&accept-language=ko`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    map.flyTo([lat, lon], 14, { duration: 1.2 });
                    document.getElementById('status-msg').textContent = `📍 이동 완료: ${data[0].display_name}`;
                    if (window.innerWidth <= 768) switchMobileTab('map');
                } else {
                    document.getElementById('status-msg').textContent = `⚠️ [${keyword}] 검색 결과 없음`;
                }
            } catch(err) {
                document.getElementById('status-msg').textContent = `⚠️ 검색 실패 (네트워크 확인)`;
            }
        });

        function runWargameSimulation(scenario, lat, lng) {
            tacticalLayer.clearLayers();

            const febaLine = L.polyline([[37.75, 126.60], [37.85, 127.05], [38.10, 127.50], [38.25, 128.40]], { color: '#2e86de', weight: 4, dashArray: '6, 6' });
            febaLine.bindPopup("<b>🛡️ 국군 주저항선 (FEBA Alpha)</b>");
            tacticalLayer.addLayer(febaLine);

            const hanRiverLine = L.polyline([[37.58, 126.80], [37.52, 126.95], [37.55, 127.10]], { color: '#0984e3', weight: 5 });
            hanRiverLine.bindPopup("<b>🛡️ 국군 한강 방어선</b>");
            tacticalLayer.addLayer(hanRiverLine);

            L.marker([37.85, 127.05], { icon: createMilIcon('friendly', '제1군단') }).addTo(tacticalLayer);
            L.marker([37.52, 126.95], { icon: createMilIcon('friendly', '수방사') }).addTo(tacticalLayer);

            const evacRoute = L.polyline([[lat, lng], [37.26, 127.02], [36.35, 127.38]], { color: '#00e676', weight: 4, dashArray: '8, 12' });
            evacRoute.bindPopup("<b>🟢 민간인 대피 경로</b>");
            tacticalLayer.addLayer(evacRoute);

            let radius = 5000;
            let color = '#ff4757';
            let title = "타격 반경";

            if (scenario === 'artillery') {
                radius = 15000; color = '#ff9f43'; title = "포격 탄착군 (15km)";
                L.marker([37.98, 126.65], { icon: createMilIcon('hostile', '적 포병진지') }).addTo(tacticalLayer);
                L.polyline([[37.98, 126.65], [lat, lng]], { color: '#ff9f43', weight: 3 }).addTo(tacticalLayer);

            } else if (scenario === 'armor') {
                radius = 20000; color = '#e84118'; title = "적 기갑 침투 구역";
                L.marker([38.30, 126.70], { icon: createMilIcon('hostile', '적 제1기갑') }).addTo(tacticalLayer);
                const adv1 = L.polyline([[38.30, 126.70], [37.95, 126.78], [lat, lng]], { color: '#ff3838', weight: 4 });
                const adv2 = L.polyline([[38.25, 127.30], [38.05, 127.20], [37.80, 127.10]], { color: '#ff3838', weight: 4 });
                tacticalLayer.addLayer(adv1);
                tacticalLayer.addLayer(adv2);

            } else if (scenario === 'nuke') {
                radius = 30000; color = '#ff3838'; title = "전술핵 피해구역 (30km)";
                L.marker([39.03, 125.75], { icon: createMilIcon('hostile', '적 미사일기지') }).addTo(tacticalLayer);
                L.polyline([[39.03, 125.75], [lat, lng]], { color: '#ff3838', weight: 3, dashArray: '4, 12' }).addTo(tacticalLayer);

            } else if (scenario === 'emp') {
                radius = 60000; color = '#00d2d3'; title = "EMP 영향권 (60km)";
            }

            const strikeCircle = L.circle([lat, lng], { color: color, fillColor: color, fillOpacity: 0.35, radius: radius });
            strikeCircle.bindPopup(`<b>💥 ${title}</b>`).openPopup();
            tacticalLayer.addLayer(strikeCircle);

            document.getElementById('status-msg').textContent = `🎯 워게임 시나리오 전개 완료`;
        }

        function parseCSVLine(text) {
            let result = [], current = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim()); return result;
        }

        async function loadShelterCSV() {
            const possibleFilenames = ['Shelter.csv', 'shelter.csv', '민방위대피시설 (2).csv'];
            let csvText = null;

            for (let filename of possibleFilenames) {
                try {
                    const response = await fetch(filename);
                    if (response.ok) {
                        const buffer = await response.arrayBuffer();
                        let text = new TextDecoder('utf-8').decode(buffer);
                        if (text.includes('')) {
                            text = new TextDecoder('euc-kr').decode(buffer);
                        }
                        csvText = text;
                        break;
                    }
                } catch(e) {}
            }

            if (!csvText) {
                document.getElementById('shelter-list-container').innerHTML = `<div style="color: #ff5252; padding: 10px; text-align: center;">Shelter.csv 로드 실패</div>`;
                return;
            }

            parseCSV(csvText);
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            shelterDataList = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = parseCSVLine(line);

                if (cols.length >= 7) {
                    let address = cols[2] ? cols[2].replace(/["']/g, "") : "";
                    let roadAddress = cols[3] ? cols[3].replace(/["']/g, "") : "";
                    let facilityName = cols[5] ? cols[5].replace(/["']/g, "") : (cols[2] || "대피시설");
                    let type = cols[6] ? cols[6].replace(/["']/g, "") : "대피소";
                    
                    let lat = parseFloat(cols[16]);
                    let lng = parseFloat(cols[17]);

                    if (isNaN(lat) || isNaN(lng)) {
                        for (let c = 0; c < cols.length; c++) {
                            let val = parseFloat(cols[c]);
                            if (!isNaN(val)) {
                                if (val >= 33 && val <= 39) lat = val;
                                if (val >= 124 && val <= 132) lng = val;
                            }
                        }
                    }

                    if (!isNaN(lat) && !isNaN(lng)) {
                        shelterDataList.push({ address, roadAddress, facilityName, type, lat, lng });
                    }
                }
            }

            document.getElementById('status-msg').textContent = `총 ${shelterDataList.length}개 대피소 로드 완료`;
            renderShelterList(shelterDataList);
            renderMapMarkers(shelterDataList);
        }

        function renderMapMarkers(shelters) {
            markerClusterGroup.clearLayers();
            const markers = [];
            shelters.forEach(s => {
                const m = L.marker([s.lat, s.lng]);
                m.bindPopup(`<b>🛡️ ${s.facilityName}</b><br>${s.roadAddress || s.address}<br>유형: ${s.type}`);
                markers.push(m);
            });
            markerClusterGroup.addLayers(markers);
        }

        function renderShelterList(shelters) {
            const container = document.getElementById('shelter-list-container');
            document.getElementById('shelter-count').textContent = shelters.length;
            container.innerHTML = '';

            if (shelters.length === 0) {
                container.innerHTML = `<div style="padding: 10px; text-align: center; color: #888;">검색 결과가 없습니다.</div>`;
                return;
            }

            shelters.slice(0, 150).forEach(s => {
                const item = document.createElement('div');
                item.className = 'shelter-item';
                item.innerHTML = `<div class="shelter-name">${s.facilityName}</div><div class="shelter-addr">${s.roadAddress || s.address}</div>`;
                item.addEventListener('click', () => {
                    map.flyTo([s.lat, s.lng], 17, { duration: 1.2 });
                    document.getElementById('status-msg').textContent = `📍 위치 이동: ${s.facilityName}`;
                    if (window.innerWidth <= 768) switchMobileTab('map');
                });
                container.appendChild(item);
            });
        }

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btn-global-search').click();
            }
        });

        window.onload = () => {
            initMap();
            loadShelterCSV();
        };
    </script>
</body>
</html>
