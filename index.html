<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전국 우리동네 비상대비 시뮬레이터 (V-World 연동판)</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        
        #app-wrapper { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: -webkit-fill-available; }
        
        header { height: 40px; background: #1e293b; padding: 0 10px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 1001; }
        header h1 { font-size: 0.8rem; font-weight: 700; color: #ef4444; margin: 0; }
        
        #main-container { position: relative; flex: 1; width: 100%; min-height: 0; background: #020617; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        /* 컨트롤 패널 */
        #control-panel { position: absolute; top: 8px; left: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px 10px; border-radius: 8px; width: 235px; font-size: 0.72rem; max-height: calc(100% - 16px); overflow-y: auto; }
        #control-panel label { display: block; color: #94a3b8; margin-top: 5px; margin-bottom: 2px; font-weight: 600; }
        
        .search-box { display: flex; gap: 4px; margin-bottom: 4px; }
        .search-box input { flex: 1; padding: 5px 8px; background: #1e293b; border: 1px solid #475569; color: #ffffff !important; border-radius: 4px; font-size: 0.72rem; }
        .search-box button { width: 50px; background: #2563eb; color: #ffffff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }

        #control-panel select, #control-panel button.btn-cmd { width: 100%; padding: 5px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 4px; font-size: 0.7rem; margin-top: 2px; }
        .btn-group { display: flex; gap: 4px; margin-top: 6px; }
        .btn-strike { background: #dc2626 !important; font-weight: bold; cursor: pointer; border: none !important; flex: 2; }
        .btn-reset { background: #475569 !important; font-weight: bold; cursor: pointer; border: none !important; flex: 1; }

        /* HUD */
        #hud { position: absolute; top: 8px; right: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px 10px; border-radius: 8px; width: 175px; font-size: 0.68rem; pointer-events: none; }
        #hud h2 { font-size: 0.75rem; color: #38bdf8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; display: flex; justify-content: space-between; }
        .hud-item { margin-bottom: 3px; display: flex; justify-content: space-between; }
        .hud-label { color: #94a3b8; }
        .hud-value { font-weight: 600; color: #f1f5f9; text-align: right; }
        
        /* 하단 수칙 */
        #guide-panel { height: 105px; background: #1e293b; border-top: 2px solid #ef4444; padding: 6px 10px; overflow-y: auto; flex-shrink: 0; z-index: 1001; font-size: 0.68rem; }
        #guide-panel h3 { color: #f59e0b; font-size: 0.72rem; margin-bottom: 2px; }
        .guide-step { margin-bottom: 2px; color: #cbd5e1; line-height: 1.2; }
        .highlight { color: #ef4444; font-weight: bold; }

        /* 인공기 마커 */
        .nk-flag-marker {
            width: 30px; height: 30px;
            background: rgba(220, 38, 38, 0.9);
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #ef4444;
            animation: pulse-flag 1.2s infinite alternate;
            font-size: 15px;
        }
        @keyframes pulse-flag {
            0% { transform: scale(0.9); box-shadow: 0 0 8px #ef4444; }
            100% { transform: scale(1.3); box-shadow: 0 0 22px #f59e0b; }
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <header>
        <h1>🚨 우리동네 비상대비 시뮬레이터 (V-World 연동판)</h1>
    </header>

    <div id="main-container">
        <div id="control-panel">
            <label>🔍 우리동네 지역/대피소 검색</label>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="예: 창포동, 수지, 강남, 포항">
                <button id="search-btn">검색</button>
            </div>

            <label for="layer-select">🗺️ V-World 지도 레이어 선택</label>
            <select id="layer-select">
                <option value="Base">V-World 기본 배경지도</option>
                <option value="Satellite">V-World 위성항공 지도</option>
                <option value="Hybrid">V-World 하이브리드 지도</option>
            </select>

            <label for="weapon-select">🎯 적 무기체계 선택</label>
            <select id="weapon-select">
                <option value="mortar_82">82mm 박격포 (파편-빨강)</option>
                <option value="shell_170">170mm 자주포 (포탄-빨강)</option>
                <option value="mlrs_240">240mm 방사포 (고폭탄-빨강)</option>
                <option value="cw_sarin">생화학 무기 (사린가스-초록)</option>
                <option value="cw_anthrax">생화학 무기 (탄저균-초록)</option>
                <option value="nuke_tactical">전술핵 폭발 (열풍-주황)</option>
            </select>

            <div class="btn-group">
                <button id="btn-auto-strike" class="btn-cmd btn-strike">💣 현위치 타격 실행</button>
                <button id="btn-clear-map" class="btn-cmd btn-reset">🔄 초기화</button>
            </div>
        </div>

        <div id="map"></div>

        <div id="hud">
            <h2>위협 및 피난 분석</h2>
            <div class="hud-item"><span class="hud-label">공격 무기:</span><span class="hud-value" id="status">대기 중</span></div>
            <div class="hud-item"><span class="hud-label">탄착 도달:</span><span class="hud-value" id="eta-time" style="color:#f59e0b;">-</span></div>
            <div class="hud-item"><span class="hud-label">피해 반경:</span><span class="hud-value" id="impact-radius" style="color:#ef4444;">-</span></div>
            <div class="hud-item"><span class="hud-label">최단 대피소:</span><span class="hud-value" id="evac-name" style="color:#4ade80;">-</span></div>
            <div class="hud-item"><span class="hud-label">대피소 거리:</span><span class="hud-value" id="evac-dist" style="color:#4ade80;">-</span></div>
            <div class="hud-item"><span class="hud-label">도보 소요:</span><span class="hud-value" id="evac-time" style="color:#38bdf8;">-</span></div>
        </div>
    </div>

    <div id="guide-panel">
        <h3>🔥 무기 유형별 비상 행동수칙</h3>
        <div class="guide-step">1. <span class="highlight">재래식 포탄/박격포(빨강):</span> 지하 2층 이하 콘크리트 대피소(지하철역, 아파트 지하주차장)로 즉시 피난.</div>
        <div class="guide-step">2. <span class="highlight">생화학(초록):</span> 가스는 지면에 깔리므로 높은 곳이나 밀폐 구역으로 이동 후 호흡기 보호.</div>
        <div class="guide-step">3. <span class="highlight">전술핵(주황):</span> 섬광 감지 즉시 폭발 반대 방향으로 엎드려 눈과 귀를 막으세요.</div>
    </div>
</div>

<script>
    // 🔑 발급받으신 V-World API 키가 적용되었습니다.
    const VWORLD_API_KEY = "AB8056F3-8810-4503-9544-FA9F94BB07C1";

    const weaponSpecs = {
        mortar_82: { name: "82mm 박격포", radius: 400, color: "#ef4444", eta: "45초" },
        shell_170: { name: "170mm 자주포", radius: 800, color: "#ef4444", eta: "1분 30초" },
        mlrs_240: { name: "240mm 방사포", radius: 1500, color: "#ef4444", eta: "2분 10초" },
        cw_sarin: { name: "사린 신경가스", radius: 2500, color: "#22c55e", eta: "3분 00초" },
        cw_anthrax: { name: "탄저균 포자", radius: 3500, color: "#22c55e", eta: "4분 30초" },
        nuke_tactical: { name: "전술핵 폭발", radius: 5000, color: "#f59e0b", eta: "1분 00초" }
    };

    const baseShelters = [
        { name: "서울역 지하철 1·4호선", lat: 37.5547, lng: 126.9706 },
        { name: "강남역 지하상가", lat: 37.4979, lng: 127.0276 },
        { name: "신촌역 지하철 2호선", lat: 37.5551, lng: 126.9369 },
        { name: "여의도역 지하환승주차장", lat: 37.5216, lng: 126.9242 },
        { name: "죽전역 지하철 수인분당선", lat: 37.3250, lng: 127.1072 },
        { name: "수지구청역 지하상가", lat: 37.3220, lng: 127.0975 },
        { name: "신봉동 주민센터 지하주차장", lat: 37.3285, lng: 127.0850 },
        { name: "성복역 신분당선 대피소", lat: 37.3132, lng: 127.0801 },
        { name: "기흥역 지하 환승주차장", lat: 37.2755, lng: 127.1160 },
        { name: "단국대학교 체육관 지하실", lat: 37.3218, lng: 127.1265 },
        { name: "판교역 지하 환승주차장", lat: 37.3947, lng: 127.1112 },
        { name: "수원역 지하철 지하공간", lat: 37.2656, lng: 127.0000 },
        { name: "포항 창포주공2단지 지하주차장", lat: 36.0682, lng: 129.3655 },
        { name: "포항 두호동 주민센터 지하층", lat: 36.0590, lng: 129.3730 },
        { name: "포항시청 지하 종합대피시설", lat: 36.0190, lng: 129.3430 },
        { name: "김천역 지하보도", lat: 36.1210, lng: 128.1180 },
        { name: "김천시청 지하주차장", lat: 36.1390, lng: 128.1130 },
        { name: "대전역 지하상가", lat: 36.3315, lng: 127.4330 },
        { name: "대구 동성로 지하상가", lat: 35.8690, lng: 128.5940 },
        { name: "부산 서면역 지하상가", lat: 35.1578, lng: 129.0592 }
    ];

    const shelterDB = [...baseShelters];
    baseShelters.forEach(s => {
        shelterDB.push({ name: `${s.name} 인근 지하주차장 A`, lat: s.lat + 0.003, lng: s.lng + 0.003 });
        shelterDB.push({ name: `${s.name} 인근 지하주차장 B`, lat: s.lat - 0.004, lng: s.lng - 0.002 });
    });

    // 지도 객체 생성 및 V-World 타일 생성 함수
    function getVWorldTileUrl(type) {
        return `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/${type}/{z}/{y}/{x}.png`;
    }

    const map = L.map('map', { zoomControl: true }).setView([36.138, 128.118], 13);

    let currentTileLayer = L.tileLayer(getVWorldTileUrl('Base'), {
        maxZoom: 19,
        attribution: '© V-World 국토지리정보원'
    }).addTo(map);

    // V-World 레이어 교체 이벤트
    document.getElementById('layer-select').addEventListener('change', function() {
        map.removeLayer(currentTileLayer);
        const selectedType = this.value;
        currentTileLayer = L.tileLayer(getVWorldTileUrl(selectedType), {
            maxZoom: 19,
            attribution: '© V-World 국토지리정보원'
        }).addTo(map);
    });

    const shelterIcon = L.divIcon({
        className: 'shelter-icon',
        html: '<div style="font-size:16px; background:#1e293b; border:2px solid #38bdf8; border-radius:50%; width:26px; height:26px; text-align:center; line-height:22px;">🏥</div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13]
    });

    shelterDB.forEach(shelter => {
        L.marker([shelter.lat, shelter.lng], { icon: shelterIcon })
            .addTo(map)
            .bindPopup(`<b>🏥 ${shelter.name}</b><br>구분: 지정 비상 지하 대피시설`);
    });

    [100, 300, 700, 1500, 2500].forEach(delay => {
        setTimeout(() => { map.invalidateSize(); }, delay);
    });

    let strikeMarkers = [];
    let impactZones = [];
    let enemyRouteLines = [];
    let evacLines = [];

    function searchLocation() {
        const query = document.getElementById('search-input').value.trim();
        if(!query) return;

        const found = shelterDB.find(s => s.name.includes(query));
        if(found) {
            map.setView([found.lat, found.lng], 14);
            L.popup().setLatLng([found.lat, found.lng]).setContent(`<b>📍 검색 지역: ${found.name}</b>`).openOn(map);
        } else {
            alert(`'${query}' 인근 대피소를 찾지 못했습니다. 지도를 직접 이동하여 눌러보세요.`);
        }
    }

    document.getElementById('search-btn').addEventListener('click', searchLocation);
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') searchLocation();
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function findNearestShelter(lat, lng) {
        let nearest = shelterDB[0];
        let minDist = calcDistance(lat, lng, nearest.lat, nearest.lng);

        for (let i = 1; i < shelterDB.length; i++) {
            const dist = calcDistance(lat, lng, shelterDB[i].lat, shelterDB[i].lng);
            if (dist < minDist) {
                minDist = dist;
                nearest = shelterDB[i];
            }
        }
        return { shelter: nearest, distance: minDist };
    }

    function executeStrike(lat, lng) {
        const weaponKey = document.getElementById('weapon-select').value;
        const weapon = weaponSpecs[weaponKey];

        const nkFlagIcon = L.divIcon({
            className: 'nk-flag-container',
            html: `<div class="nk-flag-marker">⭐</div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        const sMarker = L.marker([lat, lng], { icon: nkFlagIcon })
            .addTo(map)
            .bindPopup(`<b>🚨 북한군 발포/타격지점</b><br>공격 무기: ${weapon.name}`)
            .openPopup();
        strikeMarkers.push(sMarker);

        const iZone = L.circle([lat, lng], {
            color: weapon.color,
            fillColor: weapon.color,
            fillOpacity: 0.35,
            radius: weapon.radius
        }).addTo(map);
        impactZones.push(iZone);

        const rLine = L.polyline([[lat + 0.05, lng - 0.03], [lat, lng]], {
            color: '#ef4444',
            weight: 4,
            dashArray: '8, 8'
        }).addTo(map);
        enemyRouteLines.push(rLine);

        const result = findNearestShelter(lat, lng);
        const shelter = result.shelter;
        const distKm = result.distance;
        const walkMinutes = Math.round((distKm / 4) * 60);

        const eLine = L.polyline([[lat, lng], [shelter.lat, shelter.lng]], {
            color: '#22c55e',
            weight: 5
        }).addTo(map);
        evacLines.push(eLine);

        document.getElementById('status').innerText = weapon.name;
        document.getElementById('status').style.color = weapon.color;
        document.getElementById('eta-time').innerText = weapon.eta;
        document.getElementById('impact-radius').innerText = `${(weapon.radius / 1000).toFixed(1)} km`;
        document.getElementById('impact-radius').style.color = weapon.color;
        document.getElementById('evac-name').innerText = shelter.name;
        document.getElementById('evac-dist').innerText = `${distKm.toFixed(2)} km`;
        document.getElementById('evac-time').innerText = `약 ${walkMinutes} 분`;
    }

    map.on('click', function(e) {
        executeStrike(e.latlng.lat, e.latlng.lng);
    });

    document.getElementById('btn-auto-strike').addEventListener('click', function() {
        const center = map.getCenter();
        executeStrike(center.lat, center.lng);
    });

    document.getElementById('btn-clear-map').addEventListener('click', function() {
        strikeMarkers.forEach(m => map.removeLayer(m));
        impactZones.forEach(z => map.removeLayer(z));
        enemyRouteLines.forEach(r => map.removeLayer(r));
        evacLines.forEach(e => map.removeLayer(e));

        strikeMarkers = [];
        impactZones = [];
        enemyRouteLines = [];
        evacLines = [];

        document.getElementById('status').innerText = "대기 중";
        document.getElementById('status').style.color = "#f1f5f9";
        document.getElementById('eta-time').innerText = "-";
        document.getElementById('impact-radius').innerText = "-";
        document.getElementById('evac-name').innerText = "-";
        document.getElementById('evac-dist').innerText = "-";
        document.getElementById('evac-time').innerText = "-";
    });
</script>
</body>
</html>
