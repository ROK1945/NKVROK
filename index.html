<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>국방 싱크탱크 우리동네 비상대비 시뮬레이터 (전국 확장판)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        
        #app-wrapper { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: -webkit-fill-available; }
        
        header { height: 40px; background: #1e293b; padding: 0 10px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 1001; }
        header h1 { font-size: 0.8rem; font-weight: 700; color: #ef4444; margin: 0; }
        
        #main-container { position: relative; flex: 1; width: 100%; min-height: 0; background: #020617; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        /* 컨트롤 패널 */
        #control-panel { position: absolute; top: 8px; left: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px; border-radius: 6px; width: 185px; font-size: 0.68rem; }
        #control-panel label { display: block; color: #94a3b8; margin-top: 4px; margin-bottom: 2px; font-weight: 600; }
        #control-panel select, #control-panel button { width: 100%; padding: 4px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 4px; font-size: 0.65rem; }
        #control-panel button { margin-top: 6px; background: #2563eb; font-weight: bold; cursor: pointer; border: none; }

        /* HUD */
        #hud { position: absolute; top: 8px; right: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px; border-radius: 6px; width: 175px; font-size: 0.65rem; pointer-events: none; }
        #hud h2 { font-size: 0.72rem; color: #38bdf8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; display: flex; justify-content: space-between; }
        .hud-item { margin-bottom: 3px; display: flex; justify-content: space-between; }
        .hud-label { color: #94a3b8; }
        .hud-value { font-weight: 600; color: #f1f5f9; text-align: right; }
        
        /* 하단 수칙 */
        #guide-panel { height: 110px; background: #1e293b; border-top: 2px solid #ef4444; padding: 6px 10px; overflow-y: auto; flex-shrink: 0; z-index: 1001; font-size: 0.68rem; }
        #guide-panel h3 { color: #f59e0b; font-size: 0.72rem; margin-bottom: 2px; }
        .guide-step { margin-bottom: 2px; color: #cbd5e1; line-height: 1.2; }
        .highlight { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <header>
        <h1>🚨 전국 우리동네 비상대비 시뮬레이터 (KIDA/RAND)</h1>
    </header>

    <div id="main-container">
        <div id="control-panel">
            <label for="weapon-select">🎯 무기체계 선택</label>
            <select id="weapon-select">
                <option value="shell_170">170mm 자주포 (포탄-빨강)</option>
                <option value="mlrs_240">240mm 방사포 (포탄-빨강)</option>
                <option value="cw_sarin">생화학 무기 (사린-초록)</option>
                <option value="cw_anthrax">생화학 무기 (탄저균-초록)</option>
                <option value="nuke_tactical">전술핵 (열풍-주황)</option>
            </select>

            <label for="route-select">⚔️ 북한군 남하 축선</label>
            <select id="route-select">
                <option value="west">서부전선 (문산-서울)</option>
                <option value="center">중부전선 (철원-의정부)</option>
                <option value="east">동부전선 (속초-강릉)</option>
            </select>

            <button id="toggle-risk">⚠️ 위험도/안전구역 표시</button>
        </div>

        <div id="map"></div>

        <div id="hud">
            <h2>우리동네 위협 분석</h2>
            <div class="hud-item"><span class="hud-label">위협 종류:</span><span class="hud-value" id="status">대기 중</span></div>
            <div class="hud-item"><span class="hud-label">도달 시간:</span><span class="hud-value" id="eta-time" style="color:#f59e0b;">-</span></div>
            <div class="hud-item"><span class="hud-label">피해 반경:</span><span class="hud-value" id="impact-radius" style="color:#ef4444;">-</span></div>
            <div class="hud-item"><span class="hud-label">추천 대피소:</span><span class="hud-value" id="evac-name" style="color:#4ade80;">-</span></div>
            <div class="hud-item"><span class="hud-label">대피소 거리:</span><span class="hud-value" id="evac-dist" style="color:#4ade80;">-</span></div>
            <div class="hud-item"><span class="hud-label">도보 소요:</span><span class="hud-value" id="evac-time" style="color:#38bdf8;">-</span></div>
        </div>
    </div>

    <div id="guide-panel">
        <h3>🔥 무기 유형별 비상 행동수칙</h3>
        <div class="guide-step">1. <span class="highlight">재래식 포탄(빨강):</span> 지하 2층 이하 콘크리트 대피소(지하철역, 대형 지하주차장)로 이동.</div>
        <div class="guide-step">2. <span class="highlight">생화학(초록):</span> 독 가스는 지상에 깔리므로 고지대나 대피소 내 밀폐 구역으로 피하십시오.</div>
        <div class="guide-step">3. <span class="highlight">전술핵(주황):</span> 섬광 감지 즉시 폭발 반대 방향으로 엎드려 눈과 귀를 막으세요.</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. 무기 제원
    const weaponSpecs = {
        shell_170: { name: "170mm 포탄", radius: 800, color: "#ef4444", eta: "1분 30초" },
        mlrs_240: { name: "240mm 방사포", radius: 1500, color: "#ef4444", eta: "2분 10초" },
        cw_sarin: { name: "사린 신경가스", radius: 2500, color: "#22c55e", eta: "3분 00초" },
        cw_anthrax: { name: "탄저균 포자", radius: 3500, color: "#22c55e", eta: "4분 30초" },
        nuke_tactical: { name: "전술핵 폭발", radius: 5000, color: "#f59e0b", eta: "1분 00초" }
    };

    // 2. 최대 확장된 전국 생활권 1·2등급 대피소 데이터베이스
    const shelterDB = [
        // [서울 거점]
        { name: "서울역 지하철 1·4호선 (1등급)", lat: 37.5547, lng: 126.9706 },
        { name: "강남역 지하상가/지하철 (1등급)", lat: 37.4979, lng: 127.0276 },
        { name: "신촌역 지하철 2호선 (1등급)", lat: 37.5551, lng: 126.9369 },
        { name: "여의도역 지하 환승통로 (1등급)", lat: 37.5216, lng: 126.9242 },
        { name: "잠실역 지하광장 (1등급)", lat: 37.5133, lng: 127.1001 },
        { name: "청량리역 지하 환승센터 (1등급)", lat: 37.5802, lng: 127.0468 },
        
        // [경기 남부 / 용인·수원·성남]
        { name: "죽전역 지하철 수인분당선 (1등급)", lat: 37.3250, lng: 127.1072 },
        { name: "수지구청역 신분당선 지하상가 (1등급)", lat: 37.3220, lng: 127.0975 },
        { name: "신봉동 주민센터 지하주차장 (2등급)", lat: 37.3285, lng: 127.0850 },
        { name: "성복역 신분당선 지하 대피소 (1등급)", lat: 37.3132, lng: 127.0801 },
        { name: "동천역 지하철 3번출구 (1등급)", lat: 37.3377, lng: 127.1003 },
        { name: "기흥역 지하철 환승주차장 (1등급)", lat: 37.2755, lng: 127.1160 },
        { name: "단국대학교 용인캠퍼스 체육관 지하실 (2등급)", lat: 37.3218, lng: 127.1265 },
        { name: "판교역 지하 환승주차장 (1등급)", lat: 37.3947, lng: 127.1112 },
        { name: "서현역 지하상가 (1등급)", lat: 37.3850, lng: 127.1235 },
        { name: "수원역 지하철 지하공간 (1등급)", lat: 37.2656, lng: 127.0000 },
        { name: "광교중앙역 지하 환승센터 (1등급)", lat: 37.2885, lng: 127.0515 },

        // [포항 / 창포동·북구·남구]
        { name: "포항 창포주공2단지 지하주차장 (2등급)", lat: 36.0682, lng: 129.3655 },
        { name: "포항 두호동 주민센터 지하층 (2등급)", lat: 36.0590, lng: 129.3730 },
        { name: "포항 우현동 대형마트 지하주차장 (2등급)", lat: 36.0520, lng: 129.3580 },
        { name: "포항시청 지하 종합대피시설 (1등급)", lat: 36.0190, lng: 129.3430 },
        { name: "포항역 KTX 지하 통로 (1등급)", lat: 36.0720, lng: 129.3410 },
        { name: "포항 죽도시장 지하주차장 (2등급)", lat: 36.0360, lng: 129.3660 },

        // [김천 / 시내·혁신도시]
        { name: "김천역 지하보도 (1등급)", lat: 36.1210, lng: 128.1180 },
        { name: "김천시청 지하주차장 (1등급)", lat: 36.1390, lng: 128.1130 },
        { name: "신음동 대형마트 지하층 (2등급)", lat: 36.1350, lng: 128.1250 },
        { name: "교동 주민센터 지하실 (2등급)", lat: 36.1450, lng: 128.1050 },
        { name: "김천구미역 지하주차장 (1등급)", lat: 36.1008, lng: 128.1882 },
        { name: "율곡동 주민센터 지하주차장 (2등급)", lat: 36.1220, lng: 128.1820 },
        { name: "김천 문화예술회관 지하실 (2등급)", lat: 36.1270, lng: 128.1020 },

        // [대전 / 충청]
        { name: "대전역 지하상가 (1등급)", lat: 36.3315, lng: 127.4330 },
        { name: "대전 정부청사 지하 대피시설 (1등급)", lat: 36.3610, lng: 127.3840 },
        { name: "유성온천역 지하철 (1등급)", lat: 36.3538, lng: 127.3415 },
        { name: "청주 시청 지하 대피시설 (2등급)", lat: 36.6425, lng: 127.4890 },

        // [대구 / 영남]
        { name: "대구 동성로 지하상가 (1등급)", lat: 35.8690, lng: 128.5940 },
        { name: "반월당역 지하철 환승센터 (1등급)", lat: 35.8655, lng: 128.5935 },
        { name: "동대구역 지하 환승센터 (1등급)", lat: 35.8795, lng: 128.6285 },

        // [부산 / 경남]
        { name: "부산 서면역 지하상가 (1등급)", lat: 35.1578, lng: 129.0592 },
        { name: "부산역 지하보도 (1등급)", lat: 35.1152, lng: 129.0422 },
        { name: "해운대역 지하철 지하공간 (1등급)", lat: 35.1630, lng: 129.1585 },
        { name: "창원시청 지하주차장 (1등급)", lat: 35.2280, lng: 128.6818 },

        // [광주 / 전라]
        { name: "광주 금남로 지하상가 (1등급)", lat: 35.1480, lng: 126.9180 },
        { name: "광주송정역 지하철 (1등급)", lat: 35.1375, lng: 126.7915 },
        { name: "전주시청 지하주차장 (2등급)", lat: 35.8240, lng: 127.1480 }
    ];

    // 3. 지도 초기화
    const map = L.map('map', { zoomControl: true }).setView([36.138, 128.118], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 대피소 마커 전체 렌더링
    shelterDB.forEach(shelter => {
        L.marker([shelter.lat, shelter.lng])
            .addTo(map)
            .bindPopup(`<b>🏥 ${shelter.name}</b><br>구분: 지정 비상 지하대피시설`);
    });

    // 강제 리사이즈 반복 호출
    [100, 300, 700, 1500, 2500].forEach(delay => {
        setTimeout(() => { map.invalidateSize(); }, delay);
    });

    let strikeMarker = null;
    let impactZone = null;
    let enemyRouteLine = null;
    let evacLine = null;
    let riskLayerGroup = L.layerGroup();
    let showRisk = false;

    function renderRiskZones() {
        riskLayerGroup.clearLayers();
        if(!showRisk) return;

        L.circle([36.138, 128.118], { radius: 3000, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.25 }).addTo(riskLayerGroup);
        L.circle([36.160, 128.130], { radius: 4000, color: '#f97316', fillColor: '#f97316', fillOpacity: 0.20 }).addTo(riskLayerGroup);
        L.circle([36.100, 128.080], { radius: 3500, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.20 }).addTo(riskLayerGroup);

        riskLayerGroup.addTo(map);
    }

    document.getElementById('toggle-risk').addEventListener('click', function() {
        showRisk = !showRisk;
        renderRiskZones();
        this.innerText = showRisk ? "✅ 위험도 표시 중" : "⚠️ 위험도/안전구역 표시";
    });

    function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function findNearestShelter(lat, lng) {
        let nearest = shelterDB[0];
        let minDist = calcDistance(lat, lng, nearest.lat, nearest.lng);

        for (let i = 1; i < shelterDB.length; i++) {
            const dist = calcDistance(lat, lng, shelterDB[i].lat, shelterDB[i].lng);
            if (dist < minDist) {
                minDist = dist;
                nearest = shelterDB[i];
            }
        }
        return { shelter: nearest, distance: minDist };
    }

    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        const weaponKey = document.getElementById('weapon-select').value;
        const routeKey = document.getElementById('route-select').value;
        const weapon = weaponSpecs[weaponKey];

        if (strikeMarker) map.removeLayer(strikeMarker);
        if (impactZone) map.removeLayer(impactZone);
        if (enemyRouteLine) map.removeLayer(enemyRouteLine);
        if (evacLine) map.removeLayer(evacLine);

        strikeMarker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>💣 타격지점</b><br>${weapon.name}`).openPopup();

        impactZone = L.circle([lat, lng], {
            color: weapon.color,
            fillColor: weapon.color,
            fillOpacity: 0.4,
            radius: weapon.radius
        }).addTo(map);

        let routeStartLat = lat + 0.05;
        let routeStartLng = lng;
        if(routeKey === 'west') routeStartLng = lng - 0.03;
        else if(routeKey === 'east') routeStartLng = lng + 0.03;

        enemyRouteLine = L.polyline([[routeStartLat, routeStartLng], [lat, lng]], {
            color: '#ef4444',
            weight: 4,
            dashArray: '8, 8'
        }).addTo(map);

        const result = findNearestShelter(lat, lng);
        const shelter = result.shelter;
        const distKm = result.distance;
        const walkMinutes = Math.round((distKm / 4) * 60);

        evacLine = L.polyline([[lat, lng], [shelter.lat, shelter.lng]], {
            color: '#22c55e',
            weight: 5
        }).addTo(map);

        document.getElementById('status').innerText = weapon.name;
        document.getElementById('status').style.color = weapon.color;
        document.getElementById('eta-time').innerText = weapon.eta;
        document.getElementById('impact-radius').innerText = `${(weapon.radius / 1000).toFixed(1)} km`;
        document.getElementById('impact-radius').style.color = weapon.color;
        document.getElementById('evac-name').innerText = shelter.name;
        document.getElementById('evac-dist').innerText = `${distKm.toFixed(2)} km`;
        document.getElementById('evac-time').innerText = `약 ${walkMinutes} 분`;
    });
</script>
</body>
</html>
