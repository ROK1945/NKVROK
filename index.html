<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>국방 싱크탱크 기반 비상대비 시뮬레이터</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        
        /* 상단 헤더 고정 */
        header { position: absolute; top: 0; left: 0; right: 0; height: 40px; background: #1e293b; padding: 0 10px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; z-index: 1001; }
        header h1 { font-size: 0.8rem; font-weight: 700; color: #ef4444; }
        
        /* 지도 전체 화면 절대좌표 고정 (상단 40px, 하단 120px) */
        #map { position: absolute; top: 40px; bottom: 120px; left: 0; right: 0; background: #020617; z-index: 1; }
        
        /* 좌측 선택 컨트롤 패널 */
        #control-panel { position: absolute; top: 48px; left: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px; border-radius: 6px; width: 190px; font-size: 0.7rem; }
        #control-panel label { display: block; color: #94a3b8; margin-top: 4px; margin-bottom: 2px; font-weight: 600; }
        #control-panel select, #control-panel button { width: 100%; padding: 4px; background: #0f172a; border: 1px solid #475569; color: #f8fafc; border-radius: 4px; font-size: 0.68rem; }
        #control-panel button { margin-top: 6px; background: #2563eb; font-weight: bold; cursor: pointer; border: none; }

        /* 우측 HUD */
        #hud { position: absolute; top: 48px; right: 8px; z-index: 1000; background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; backdrop-filter: blur(8px); padding: 8px; border-radius: 6px; width: 180px; font-size: 0.68rem; pointer-events: none; }
        #hud h2 { font-size: 0.75rem; color: #38bdf8; margin-bottom: 4px; border-bottom: 1px solid #334155; padding-bottom: 2px; display: flex; justify-content: space-between; }
        .hud-item { margin-bottom: 3px; display: flex; justify-content: space-between; }
        .hud-label { color: #94a3b8; }
        .hud-value { font-weight: 600; color: #f1f5f9; text-align: right; }
        
        /* 하단 행동수칙 패널 고정 */
        #guide-panel { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: #1e293b; border-top: 2px solid #ef4444; padding: 8px 10px; overflow-y: auto; z-index: 1001; font-size: 0.7rem; }
        #guide-panel h3 { color: #f59e0b; font-size: 0.75rem; margin-bottom: 3px; }
        .guide-step { margin-bottom: 2px; color: #cbd5e1; line-height: 1.25; }
        .highlight { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>🚨 비상대비 시뮬레이터 (RAND/KIDA)</h1>
</header>

<!-- 조건 선택 패널 -->
<div id="control-panel">
    <label for="weapon-select">🎯 무기체계 선택</label>
    <select id="weapon-select">
        <option value="shell_170">170mm 자주포 (포탄-빨강)</option>
        <option value="mlrs_240">240mm 방사포 (포탄-빨강)</option>
        <option value="cw_sarin">생화학 무기 (사린-초록)</option>
        <option value="cw_anthrax">생화학 무기 (탄저균-초록)</option>
        <option value="nuke_tactical">전술핵 (열풍-주황)</option>
    </select>

    <label for="route-select">⚔️ 북한군 남하 축선</label>
    <select id="route-select">
        <option value="west">서부전선 (문산-서울)</option>
        <option value="center">중부전선 (철원-의정부)</option>
        <option value="east">동부전선 (속초-강릉)</option>
    </select>

    <button id="toggle-risk">⚠️ 위험도/안전구역 표시</button>
</div>

<div id="map"></div>

<!-- 실시간 분석 HUD -->
<div id="hud">
    <h2>위협 영향 분석</h2>
    <div class="hud-item"><span class="hud-label">위협 종류:</span><span class="hud-value" id="status">대기 중</span></div>
    <div class="hud-item"><span class="hud-label">도달 시간:</span><span class="hud-value" id="eta-time" style="color:#f59e0b;">-</span></div>
    <div class="hud-item"><span class="hud-label">피해 반경:</span><span class="hud-value" id="impact-radius" style="color:#ef4444;">-</span></div>
    <div class="hud-item"><span class="hud-label">추천 대피소:</span><span class="hud-value" id="evac-name" style="color:#4ade80;">-</span></div>
    <div class="hud-item"><span class="hud-label">대피소 거리:</span><span class="hud-value" id="evac-dist" style="color:#4ade80;">-</span></div>
    <div class="hud-item"><span class="hud-label">도보 소요:</span><span class="hud-value" id="evac-time" style="color:#38bdf8;">-</span></div>
</div>

<div id="guide-panel">
    <h3>🔥 유형별 비상 대응 수칙</h3>
    <div class="guide-step">1. <span class="highlight">재래식 포탄(빨강):</span> 지하 2층 이하 콘크리트 대피소로 이동하세요.</div>
    <div class="guide-step">2. <span class="highlight">생화학(초록):</span> 독 가스는 바닥에 깔리므로 높은 곳이나 밀폐 구역으로 피하십시오.</div>
    <div class="guide-step">3. <span class="highlight">전술핵(주황):</span> 섬광 감지 즉시 반대 방향으로 엎드려 눈과 귀를 막으세요.</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
