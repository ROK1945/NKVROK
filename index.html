<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대한민국 민방위 및 비상 대피 시뮬레이터 (NKVKOK)</title>
    
    <!-- Leaflet 지도 라이브러리 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 좌측 컨트롤 패널 */
        #sidebar { width: 400px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; z-index: 1000; overflow-y: auto; }
        h1 { font-size: 18px; margin-bottom: 15px; color: #ff5252; border-bottom: 2px solid #ff5252; padding-bottom: 8px; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #aaa; font-weight: bold; }
        select, input { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
        
        /* 대피소 목록 영역 */
        #shelter-list-container { max-height: 250px; overflow-y: auto; margin-top: 5px; border: 1px solid #333; background: #181818; border-radius: 4px; padding: 5px; }
        .shelter-item { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 12px; cursor: pointer; }
        .shelter-item:hover { background: #2c2c2c; }
        .shelter-name { font-weight: bold; color: #ff8a80; font-size: 12px; margin-bottom: 2px; }
        .shelter-addr { color: #aaa; font-size: 11px; }

        /* 우측 실제 지도 영역 */
        #map { flex-grow: 1; height: 100%; z-index: 1; }
        
        #status-msg { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 4px; font-size: 12px; border-left: 3px solid #00ffcc; z-index: 2000; color: #00ffcc; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>🛡️ 대한민국 비상대피 시뮬레이터</h1>
        
        <!-- 위협 단계 설정 -->
        <div class="control-group">
            <label for="threat-level">위협 단계 (DEFCON)</label>
            <select id="threat-level">
                <option value="4">DEFCON 4 (평시 경계)</option>
                <option value="3">DEFCON 3 (국지전 징후)</option>
                <option value="2">DEFCON 2 (전면전 임박)</option>
                <option value="1" selected>DEFCON 1 (전시 상황)</option>
            </select>
        </div>

        <!-- 북한 무기 및 타격 시나리오 선택 -->
        <div class="control-group">
            <label for="weapon-type">북한 위협 무기 체계 선택</label>
            <select id="weapon-type">
                <option value="nuke">핵폭탄 (150kt 단거리/중거리 탄도미사일)</option>
                <option value="artillery" selected>장사정포 및 300mm 방사포 (수도권 타격)</option>
                <option value="missile">화성-17/18형 ICBM 및 극초음속 미사일</option>
                <option value="emp">EMP탄 (고고도 전자기파 공격)</option>
            </select>
        </div>

        <!-- 지도 모드 선택 (브이월드 연동) -->
        <div class="control-group">
            <label for="map-mode">전술 지도 모드 선택</label>
            <select id="map-mode">
                <option value="satellite" selected>브이월드 위성 항공 샷</option>
                <option value="gray">브이월드 백지도 (회색조)</option>
                <option value="midnight">브이월드 야간 맵</option>
            </select>
        </div>

        <!-- 대피소 검색 -->
        <div class="control-group">
            <label for="search-shelter">대피소 검색 (지역/시설명)</label>
            <input type="text" id="search-shelter" placeholder="예: 종로구, 성균관대, 부산">
        </div>

        <label>근린 대피소 목록 (<span id="shelter-count">0</span>개)</label>
        <div id="shelter-list-container">
            <div style="text-align: center; color: #666; padding: 15px;">전국 대피소 데이터 로딩 중...</div>
        </div>
    </div>

    <div id="map"></div>
    <div id="status-msg">시스템 초기화 중...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const VWORLD_API_KEY = "AB8056F3-8810-4503-9544-FA9F94BB07C1";
        let map;
        let shelterDataList = [];
        let markersGroup = L.layerGroup();
        let tileLayers = {};

        function initMap() {
            // 초기 위치: 서울 중심
            map = L.map('map', {
                maxZoom: 19,
                minZoom: 6
            }).setView([37.5665, 126.9780], 11);

            // 브이월드 타일 레이어 설정 (제공해주신 API 키 적용)
            // 1. 위성 지도
            tileLayers.satellite = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/Satellite/{z}/{y}/{x}.jpeg`, {
                attribution: '&copy; V-World Satellite',
                maxZoom: 19
            });

            // 2. 백지도 (Gray)
            tileLayers.gray = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/gray/{z}/{y}/{x}.png`, {
                attribution: '&copy; V-World Gray',
                maxZoom: 19
            });

            // 3. 야간 지도 (Midnight)
            tileLayers.midnight = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_API_KEY}/midnight/{z}/{y}/{x}.png`, {
                attribution: '&copy; V-World Midnight',
                maxZoom: 19
            });

            // 기본값으로 위성 지도 적용
            tileLayers.satellite.addTo(map);
            markersGroup.addTo(map);
        }

        // 지도 모드 변경 이벤트
        document.getElementById('map-mode').addEventListener('change', (e) => {
            const mode = e.target.value;
            Object.values(tileLayers).forEach(layer => map.removeLayer(layer));
            if (tileLayers[mode]) {
                tileLayers[mode].addTo(map);
            }
        });

        // 무기 선택 변경 이벤트 연동
        document.getElementById('weapon-type').addEventListener('change', (e) => {
            const weapon = e.target.value;
            const msg = {
                'nuke': '⚠️ 경고: 핵폭탄 타격 시나리오 활성화 (최상위 방호 시설 대피 필요)',
                'artillery': '⚠️ 경고: 수도권 장사정포/방사포 포격 징후 감지 (지하 대피소 즉시 대피)',
                'missile': '⚠️ 경고: 전략 미사일 발사 징후 감지 (방공 경보 발령)',
                'emp': '⚠️ 경고: EMP탄 공중 폭발 대비 전자기기 차단 태세'
            };
            document.getElementById('status-msg').textContent = msg[weapon] || "전술 상황 대기 중";
        });

        // CSV 안전 파싱 함수 (주소 내 쉼표 오류 방지)
        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        // Shelter.csv 파일 비동기 로드 및 인코딩 자동 감지
        async function loadShelterCSV() {
            try {
                const response = await fetch('Shelter.csv');
                if (!response.ok) throw new Error(`HTTP 에러: ${response.status}`);
                
                const buffer = await response.arrayBuffer();
                let decoder = new TextDecoder('utf-8');
                let csvText = decoder.decode(buffer);
                
                if (csvText.includes('')) {
                    decoder = new TextDecoder('euc-kr');
                    csvText = decoder.decode(buffer);
                }

                parseCSV(csvText);
            } catch (error) {
                console.error("파일 로드 실패:", error);
                document.getElementById('shelter-list-container').innerHTML = 
                    `<div style="color: #ff5252; padding: 10px; text-align: center;">파일을 불러오지 못했습니다.<br>Shelter.csv 파일을 확인해주세요.</div>`;
                document.getElementById('status-msg').textContent = "⚠️ 대피소 데이터 로드 실패";
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            shelterDataList = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const columns = parseCSVLine(line);

                if (columns.length >= 18) {
                    const address = columns[2].replace(/^["']|["']$/g, "");
                    const roadAddress = columns[3].replace(/^["']|["']$/g, "");
                    const facilityName = columns[5].replace(/^["']|["']$/g, "");
                    const facilityType = columns[6].replace(/^["']|["']$/g, "");
                    const locationDesc = columns[7].replace(/^["']|["']$/g, "");
                    const lat = parseFloat(columns[12]);
                    const lng = parseFloat(columns[13]);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        shelterDataList.push({ address, roadAddress, facilityName, facilityType, locationDesc, lat, lng });
                    }
                }
            }

            document.getElementById('status-msg').textContent = `총 ${shelterDataList.length}개 대피소 로드 완료`;
            renderShelterList(shelterDataList);
            renderMapMarkers(shelterDataList);
        }

        function renderMapMarkers(shelters) {
            markersGroup.clearLayers();
            const renderTarget = shelters.slice(0, 500); // 렌더링 성능 최적화

            renderTarget.forEach(shelter => {
                const marker = L.marker([shelter.lat, shelter.lng]);
                marker.bindPopup(`
                    <div style="color: #333; font-family: sans-serif; min-width: 200px;">
                        <b style="font-size: 14px; color: #d32f2f;">🛡️ ${shelter.facilityName}</b><br>
                        <hr style="margin: 5px 0; border: 0; border-top: 1px solid #ccc;">
                        <b>도로명:</b> ${shelter.roadAddress || '정보 없음'}<br>
                        <b>지번:</b> ${shelter.address}<br>
                        <b>구분:</b> ${shelter.facilityType} (${shelter.locationDesc})
                    </div>
                `);
                markersGroup.addLayer(marker);
            });
        }

        function renderShelterList(shelters) {
            const container = document.getElementById('shelter-list-container');
            document.getElementById('shelter-count').textContent = shelters.length;
            container.innerHTML = '';

            if (shelters.length === 0) {
                container.innerHTML = `<div style="padding: 10px; text-align: center; color: #888;">검색 결과가 없습니다.</div>`;
                return;
            }

            shelters.slice(0, 200).forEach(shelter => {
                const item = document.createElement('div');
                item.className = 'shelter-item';
                item.innerHTML = `
                    <div class="shelter-name">${shelter.facilityName}</div>
                    <div class="shelter-addr">${shelter.roadAddress || shelter.address}</div>
                `;
                
                item.addEventListener('click', () => {
                    map.setView([shelter.lat, shelter.lng], 16);
                });

                container.appendChild(item);
            });
        }

        document.getElementById('search-shelter').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = shelterDataList.filter(s => 
                s.facilityName.toLowerCase().includes(keyword) || 
                s.address.toLowerCase().includes(keyword) || 
                s.roadAddress.toLowerCase().includes(keyword)
            );
            renderShelterList(filtered);
            renderMapMarkers(filtered);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadShelterCSV();
        });
    </script>
</body>
</html>
